# ===================================================================
# KIEMJOB BACKEND - COMMON APPLICATION CONFIGURATION
# ===================================================================

spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server & Reverse Proxy (ALB / CloudFront / Nginx)
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# JPA Common Settings
spring.jpa.open-in-view=false

# Spring Boot Actuator (Health check & Info for ALB probes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Business Constants
app.otp.expiration-minutes=10
app.jwt.expiration-ms=604800000

# VNPay Constants
vnpay.version=2.1.0
vnpay.currency-code=VND
vnpay.locale=vn
vnpay.order-type=other

# ===================================================================
# Spring AI 2.0 (OpenAI Starter configured for Groq)
# ===================================================================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.timeout=${GROQ_TIMEOUT:90s}

# Spring AI Retry Configuration
spring.ai.retry.max-attempts=${SPRING_AI_RETRY_MAX_ATTEMPTS:3}
spring.ai.retry.backoff.initial-interval=${SPRING_AI_RETRY_INITIAL_INTERVAL:1s}
spring.ai.retry.backoff.multiplier=${SPRING_AI_RETRY_MULTIPLIER:2.0}
spring.ai.retry.backoff.max-interval=${SPRING_AI_RETRY_MAX_INTERVAL:10s}
spring.ai.retry.on-http-codes=429,503

# Groq fallback properties
groq.api-key=${spring.ai.openai.api-key}
groq.base-url=${spring.ai.openai.base-url}
groq.model=${spring.ai.openai.chat.options.model}
groq.timeout-seconds=90
groq.max-retries=3

# AI Rate Limiting (Per-user window)
app.ai.rate-limit.max-requests-per-minute=${AI_RATE_LIMIT_PER_MINUTE:10}
app.ai.rate-limit.window-seconds=${AI_RATE_LIMIT_WINDOW_SECONDS:60}

# Job Moderation AI Threshold & Limits
moderation.risk-threshold=${MODERATION_RISK_THRESHOLD:0.7}
moderation.max-checks-per-hour=${MODERATION_MAX_CHECKS_PER_HOUR:5}

# ===================================================================
# Job Lifecycle Scheduler & ShedLock (Multi-Instance Concurrency)
# ===================================================================
app.scheduler.enabled=${SCHEDULER_ENABLED:true}
app.scheduler.expire-jobs-cron=${SCHEDULER_EXPIRE_JOBS_CRON:0 0 * * * *}
app.scheduler.clear-featured-cron=${SCHEDULER_CLEAR_FEATURED_CRON:0 0 * * * *}
app.scheduler.reminder-cron=${SCHEDULER_REMINDER_CRON:0 0 8 * * *}
app.scheduler.reminder-zone=${SCHEDULER_REMINDER_ZONE:Asia/Ho_Chi_Minh}


