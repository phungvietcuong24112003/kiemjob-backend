# ===================================================================
# KIEMJOB BACKEND - PRODUCTION PROFILE (application-prod.properties)
# ===================================================================

# Database (AWS RDS PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for AWS RDS PostgreSQL behind ECS Fargate)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=KiemJob-HikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Error details (Strictly disabled in Production to avoid information disclosure)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# CORS & Cookies (Production HTTPS behind ALB/CloudFront)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cookie.secure=true
app.frontend-url=${FRONTEND_URL}

# JWT Secret (HS512 >= 64 bytes Base64 from AWS Secrets Manager)
app.jwt.secret-base64=${JWT_SECRET}

# OTP Pepper (From AWS Secrets Manager)
app.otp.pepper=${OTP_PEPPER}

# Mail Delivery (Amazon SES SMTP or Mailer)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# AWS S3 (Using ECS IAM Task Role via DefaultCredentialsProvider)
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.access-key=
aws.s3.secret-key=
app.aws.s3.bucket=${aws.s3.bucket}

# VNPay Production / Sandbox Gateway
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.pay-url=${vnpay.payment-url}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}

# Logging (Production - Structured, Minimal, No sensitive trace logs)
logging.level.root=INFO
logging.level.com.kiemjob.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

